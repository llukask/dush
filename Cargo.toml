[package]
name = "diskalyzer"
version = "0.1.0"
edition = "2024"

[features]
# Enables the GTK4 GUI binary. Off by default so a plain `cargo build`
# only requires the CLI's pure-Rust dependencies — GTK requires system
# libraries (gtk4, glib, cairo, pango, ...) that aren't present on a
# stock Linux box without an explicit dev environment. The included
# `flake.nix` provides one.
gui = ["dep:gtk", "dep:async-channel"]

[dependencies]
async-channel = { version = "2.5.0", optional = true }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
csv = "1.4.0"
diskus = "0.9.0"
gtk = { version = "0.11.3", package = "gtk4", features = ["v4_10"], optional = true }
humansize = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
libc = "0.2.186"
tempfile = "3.27.0"

# Explicit bin entries so we can attach `required-features` to the GUI:
# without it, `cargo build` on a machine without GTK system libs would
# fail to build the GUI bin even though the user only asked for the CLI.
[[bin]]
name = "diskalyzer"
path = "src/main.rs"

[[bin]]
name = "diskalyzer-gui"
path = "src/bin/diskalyzer-gui.rs"
required-features = ["gui"]
